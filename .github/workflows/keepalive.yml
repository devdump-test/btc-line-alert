name: Keepalive

# GitHub จะหยุดรันงานตามเวลาใน repo สาธารณะที่ไม่มีความเคลื่อนไหว 60 วัน
# งานนี้ commit เปล่าเดือนละครั้งเพื่อกันไม่ให้หยุด
on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "keepalive"
          git push
